name: CI

on:
  pull_request:
  # Work lands on main directly as well as through PRs, so verify pushes to main
  # too — otherwise a direct commit is never checked by anything.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gdal-bin \
            libgdal-dev \
            libhdf5-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            pkg-config \
            snaphu
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python validation dependencies
        run: |
          python -m pip install "GDAL==$(gdal-config --version)" \
            asf-search fsspec h5py numpy pyproj rasterio requests ruamel.yaml scipy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Rust tests
        # Mesa's software Vulkan adapter caps buffer bindings at 128 MiB; the
        # 384-date GPU stress contract requires a hardware adapter with ~190 MiB.
        run: cargo test --workspace -- --skip gpu_emi_deterministic_384
      - name: Python validation tests
        run: |
          python -m compileall -q validation
          python -m unittest discover -s validation/tests -p 'test_*.py'
